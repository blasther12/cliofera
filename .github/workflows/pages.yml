name: Deploy Cliofera to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate PWA icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python scripts/generate-icons.py

      - name: Validate complete curriculum
        run: |
          node scripts/validate-content.mjs
          node scripts/validate-review.mjs
          node --check docs/assets/app.js
          node --check docs/assets/install.js
          node --check docs/assets/greece-enhancement.js
          node --check docs/assets/curriculum-review.js
          node --check docs/assets/study-tools.js
          node --check docs/assets/theme.js
          python -m json.tool docs/data.json > /dev/null
          python -m json.tool docs/extra-courses.json > /dev/null
          python -m json.tool docs/extra-courses-review.json > /dev/null
          python -m json.tool docs/study-map.json > /dev/null
          python -m json.tool docs/assessments.json > /dev/null
          python -m json.tool docs/literature.json > /dev/null
          python -m json.tool docs/literature-review.json > /dev/null
          python -m json.tool docs/media.json > /dev/null
          python -m json.tool docs/timeline.json > /dev/null
          python -m json.tool docs/manifest.webmanifest > /dev/null
          python -m json.tool docs/content.json > /dev/null
          python -m json.tool docs/content/year-1.json > /dev/null
          python -m json.tool docs/content/year-2.json > /dev/null
          python -m json.tool docs/content/year-3.json > /dev/null
          python -m json.tool docs/content/year-4.json > /dev/null
          python -m json.tool docs/content/extension-a.json > /dev/null
          python -m json.tool docs/content/extension-b.json > /dev/null
          python -m json.tool docs/content/extension-c1.json > /dev/null
          python -m json.tool docs/content/extension-c2.json > /dev/null
          python -m json.tool docs/content/greece-expansion.json > /dev/null
          python -m json.tool docs/content/final-review.json > /dev/null
          test -s docs/assets/study-tools.css
          test -s docs/icons/apple-touch-icon-v2.png
          test -s docs/icons/icon-192-v2.png
          test -s docs/icons/icon-512-v2.png

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
