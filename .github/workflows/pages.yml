name: Deploy Cliofera to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate complete curriculum
        run: |
          node scripts/validate-content.mjs
          node --check docs/assets/app.js
          python -m json.tool docs/data.json > /dev/null
          python -m json.tool docs/extra-courses.json > /dev/null
          python -m json.tool docs/literature.json > /dev/null
          python -m json.tool docs/content.json > /dev/null
          python -m json.tool docs/content/year-1.json > /dev/null
          python -m json.tool docs/content/year-2.json > /dev/null
          python -m json.tool docs/content/year-3.json > /dev/null
          python -m json.tool docs/content/year-4.json > /dev/null
          python -m json.tool docs/content/extension-a.json > /dev/null
          python -m json.tool docs/content/extension-b.json > /dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
