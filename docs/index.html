<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cliofera — uma faculdade autodidata de História com currículo, fontes, historiografia, literatura, cronologia e pesquisa." />
  <meta name="theme-color" content="#171611" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cliofera" />
  <title>Cliofera · Faculdade Livre de História</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/cliofera-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="./assets/course-content.css" />
  <link rel="stylesheet" href="./assets/course-content-v2.css" />
  <link rel="stylesheet" href="./assets/brand.css" />
  <link rel="stylesheet" href="./assets/theme.css" />
  <link rel="stylesheet" href="./assets/media-timeline.css" />
  <link rel="stylesheet" href="./assets/install.css" />
  <script src="./assets/theme.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Cliofera — painel principal">
        <span class="brand-mark"><img src="./icons/cliofera-mark.svg" alt="" width="46" height="46" /></span>
        <span><strong>Cliofera</strong><small>Faculdade Livre de História</small></span>
      </a>
      <button id="menuButton" class="menu-button" aria-label="Abrir navegação">☰</button>
      <nav id="topNav" class="topnav">
        <a href="#/">Painel</a>
        <a href="#/curriculo">Currículo</a>
        <a href="#/timeline">Cronologia</a>
        <a href="#/debates">Grandes Debates</a>
        <a href="#/metodo">Método</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema">☾ Escuro</button>
        <button id="installApp" class="nav-install" hidden>Instalar</button>
      </nav>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="footer">
      <span>Cliofera · estudo histórico autodirigido</span>
      <div class="footer-actions">
        <button id="exportProgress" class="text-button">Exportar progresso</button>
        <button id="importProgress" class="text-button">Importar progresso</button>
        <button id="resetProgress" class="text-button">Zerar progresso</button>
        <input id="importProgressFile" type="file" accept="application/json,.json" hidden />
      </div>
    </footer>

    <nav class="mobile-tabbar" aria-label="Navegação móvel">
      <a href="#/" aria-label="Painel"><span>⌂</span><small>Painel</small></a>
      <a href="#/curriculo" aria-label="Currículo"><span>▦</span><small>Currículo</small></a>
      <a href="#/timeline" aria-label="Cronologia"><span>⌛</span><small>Tempo</small></a>
      <a href="#/debates" aria-label="Debates"><span>◈</span><small>Debates</small></a>
      <a href="#/metodo" aria-label="Método"><span>✦</span><small>Método</small></a>
    </nav>
  </div>

  <script src="./assets/app.js" defer></script>
  <script src="./assets/install.js" defer></script>
  <script src="./assets/greece-enhancement.js" defer></script>
  <script src="./assets/curriculum-review.js" defer></script>
</body>
</html>
